apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogapp-frontend
  labels:
    app: blogapp-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: blogapp-frontend
  template:
    metadata:
      labels:
        app: blogapp-frontend
    spec:
      containers:
        - name: frontend
          image: 382170164329.dkr.ecr.ap-south-1.amazonaws.com/blogapp-frontend:stage2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "blogapp-backend"
            - name: BACKEND_PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: blogapp-frontend
spec:
  type: LoadBalancer
  selector:
    app: blogapp-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
